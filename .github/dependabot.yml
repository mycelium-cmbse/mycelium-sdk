version: 2

updates:
  # Every action in .github/workflows is referenced by a full semver tag (e.g. @v7.0.1)
  # rather than a floating major (@v7), so a new release never lands silently. Dependabot
  # is what keeps those tags current: it opens a weekly PR per action that has moved.
  #
  # NuGet is deliberately not managed here: the nuget-reference-check workflow already
  # reports outdated, deprecated and vulnerable packages and opens (and closes) a single
  # tracking issue for them. A second, unaware NuGet updater would fight that.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[Update]"
    labels:
      - "dependencies"
      - "maintenance"
